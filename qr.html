<head>
<meta charset="utf-8">

<title>Scan to book · Austin Co-Host Co.</title>
<meta name="theme-color" content="#0A3238">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A3238'/%3E%3Ccircle cx='32' cy='38' r='15' fill='%23FF6B2C'/%3E%3Crect x='10' y='40' width='44' height='14' fill='%230A3238'/%3E%3Crect x='10' y='39' width='44' height='2.5' rx='1.2' fill='%23FFC46B'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Archivo"; src: url("fonts/archivo-var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh; overflow: hidden; position: relative; isolation: isolate;
    display: grid; grid-template-rows: auto 1fr auto;
    color: #FFF6EA; background: #0A3238;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .sky { position: fixed; inset: 0; z-index: -3; background: linear-gradient(180deg, #0A3238 0%, #2C6A70 30%, #EE7A57 58%, #FF9446 76%, #FFD08A 94%); }
  .sun { position: fixed; z-index: -2; left: 50%; bottom: 6vh; width: min(120vmin, 1100px); aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%;
         background: radial-gradient(circle, rgba(255,237,190,.95) 0 34%, rgba(255,226,160,.5) 34.5% 42%, rgba(255,196,107,0) 70%); }
  .skyline { position: fixed; left: 0; right: 0; bottom: 0; z-index: -1; height: clamp(90px, 18vh, 220px); }
  .skyline svg { width: 100%; height: 100%; display: block; }
  header { display: flex; align-items: center; gap: 12px; padding: clamp(16px, 3vmin, 32px) clamp(16px, 4vmin, 48px); font-weight: 800; font-size: clamp(16px, 2.4vmin, 26px); letter-spacing: -.01em; }
  main { display: grid; place-items: center; align-content: center; gap: clamp(16px, 3.4vmin, 40px); padding: 0 clamp(16px, 4vmin, 48px) clamp(100px, 20vh, 240px); text-align: center; }
  .qr {
    width: min(56vmin, 620px); aspect-ratio: 1; background: #fff; border-radius: clamp(18px, 3vmin, 36px);
    padding: clamp(12px, 2vmin, 24px); display: grid; place-items: center;
    box-shadow: 0 30px 80px -20px rgba(10,50,56,.6), 0 0 0 clamp(6px, 1vmin, 12px) #FF6B2C;
  }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qr .fallback { color: #0A3238; font-weight: 600; padding: 12px; font-size: clamp(14px, 2.4vmin, 22px); word-break: break-all; }
  h1 {
    margin: 0; max-width: 14ch;
    font-family: "Archivo", "Arial Narrow", sans-serif; font-weight: 900; font-stretch: 62%;
    text-transform: uppercase; line-height: .9; letter-spacing: -.01em;
    font-size: clamp(40px, 8.6vmin, 112px); color: #0A3238;
  }
  .url { margin: 0; font-size: clamp(15px, 2.6vmin, 28px); font-weight: 700; color: #0A3238; word-break: break-all; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 16px calc(clamp(10px, 2vh, 22px) + env(safe-area-inset-bottom)); text-align: center; font-size: clamp(11px, 1.6vmin, 15px); color: #B9CFCB; background: #0A3238; }
  @media (orientation: landscape) and (min-width: 800px) {
    main { grid-template-columns: auto minmax(0, 1fr); text-align: left; justify-content: center; column-gap: clamp(32px, 6vmin, 96px); max-width: 1500px; margin: 0 auto; width: 100%; }
    .qr { grid-row: span 2; width: min(62vmin, 640px); }
    h1 { align-self: end; max-width: 9ch; font-size: clamp(56px, 12vmin, 150px); }
    .url { align-self: start; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="sun" aria-hidden="true"></div>
<div class="skyline" aria-hidden="true">
  <svg viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice" focusable="false"><g fill="#0A3238">
    <path d="M0 140C150 120 300 132 450 124S760 104 900 118s200-6 300 2V220H0z" opacity=".2"/>
    <rect x="150" y="96" width="34" height="100"/><rect x="190" y="70" width="28" height="126"/><path d="M222 196V62h12V50h14v12h12v134z"/>
    <rect x="266" y="86" width="30" height="110"/><path d="M300 196V40l13-10 13 10v156z"/><rect x="330" y="78" width="40" height="118"/>
    <rect x="376" y="100" width="28" height="96"/><path d="M410 196V66l17-8 17 8v130z"/><rect x="450" y="112" width="30" height="84"/>
    <rect x="560" y="150" width="120" height="46"/><rect x="588" y="130" width="64" height="22"/><path d="M592 132q28-52 56 0z"/><rect x="616" y="66" width="8" height="22"/>
    <ellipse cx="70" cy="164" rx="66" ry="30"/><ellipse cx="760" cy="170" rx="52" ry="24"/><ellipse cx="1150" cy="166" rx="60" ry="28"/>
    <rect x="900" y="96" width="150" height="100"/><rect x="892" y="88" width="166" height="12" rx="3"/>
    <rect x="916" y="112" width="30" height="28" rx="2" fill="#FFC46B"/><rect x="1004" y="112" width="30" height="28" rx="2" fill="#FFC46B"/><rect x="962" y="152" width="26" height="44" rx="2" fill="#FFC46B" opacity=".9"/>
    <path d="M0 184C200 176 420 182 600 178S1000 172 1200 180V220H0z"/>
  </g></svg>
</div>

<header>
  <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#FFF6EA" opacity=".16"/><circle cx="32" cy="38" r="15" fill="#FF6B2C"/><rect x="10" y="40" width="44" height="14" fill="#0A3238"/><rect x="10" y="39" width="44" height="2.5" rx="1.2" fill="#FFC46B"/></svg>
  <span>Austin Co-Host Co.</span>
</header>
<main>
  <div class="qr" id="qr" role="img" aria-label="QR code that opens the booking site"></div>
  <h1>Book a stay. Bots reply in minutes.</h1>
  <p class="url" id="url"></p>
</main>
<footer>Demo built at the Grok Bot Hackathon Austin. Test mode only, no real bookings.</footer>

<script>
(function () {
  "use strict";
  // Points at index.html in the same folder: window.location.origin + this folder's path.
  // Works at the domain root (/qr.html -> /) and in a subfolder (/cohost/qr.html -> /cohost/).
  var dir = window.location.pathname.replace(/[^/]*$/, "");
  var target = window.location.origin + dir;
  var prop = new URLSearchParams(window.location.search).get("property");
  if (prop && /^[a-z0-9_-]{1,32}$/i.test(prop)) target += "?property=" + encodeURIComponent(prop.toLowerCase());

  var box = document.getElementById("qr");
  document.getElementById("url").textContent = target.replace(/^https?:\/\//, "").replace(/\/$/, "");

  function render() {
    if (typeof window.qrcode !== "function") return fail();
    var qr = window.qrcode(0, "M");
    qr.addData(target);
    qr.make();
    var n = qr.getModuleCount(), q = 4, size = n + q * 2, d = "";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += "M" + (c + q) + " " + (r + q) + "h1v1h-1z";
    box.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + " " + size + '" shape-rendering="crispEdges" aria-hidden="true">' +
      '<rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#0A3238"/></svg>';
    box.setAttribute("aria-label", "QR code that opens " + target);
  }
  function fail() {
    box.innerHTML = '<p class="fallback">Couldn\'t load the QR code. Visit ' + target.replace(/[<>&"]/g, "") + "</p>";
  }

  // Small QR library from cdnjs, with jsDelivr as a backup.
  var sources = [
    "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js",
    "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"
  ];
  (function load(i) {
    if (typeof window.qrcode === "function") return render();
    if (i >= sources.length) return fail();
    var s = document.createElement("script");
    s.src = sources[i]; s.async = true; s.crossOrigin = "anonymous"; s.referrerPolicy = "no-referrer";
    s.onload = function () { typeof window.qrcode === "function" ? render() : load(i + 1); };
    s.onerror = function () { load(i + 1); };
    document.head.appendChild(s);
  })(0);

  // Keep the second screen awake while this page is showing (where supported).
  function wake() { try { if ("wakeLock" in navigator && document.visibilityState === "visible") navigator.wakeLock.request("screen").catch(function () {}); } catch (_) {} }
  wake(); document.addEventListener("visibilitychange", wake);
})();
</script>
</body>
</html>
